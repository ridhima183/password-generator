<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrapper">
    <article class="generator-card">
      <header>
        <h1>Password Generator</h1>
      </header>

      <!-- Output Section -->
      <section class="display-group" aria-live="polite">
        <input type="text" id="password" placeholder="Your secure password" readonly aria-label="Generated password" />
        <button id="copyBtn" type="button">Copy</button>
      </section>

      <!-- Configurations Form -->
      <form id="generatorForm" class="options-group" onsubmit="event.preventDefault();">
        <div class="range-field">
          <label for="length">Password Length (<output id="lengthValue">12</output>)</label>
          <input type="range" id="length" min="4" max="32" value="12" />
        </div>

        <fieldset class="checkbox-fieldset">
          <legend class="sr-only">Character Options</legend>
          
          <label class="checkbox-label">
            <input type="checkbox" id="uppercase" checked />
            <span>Uppercase Letters</span>
          </label>

          <label class="checkbox-label">
            <input type="checkbox" id="numbers" checked />
            <span>Numbers (0-9)</span>
          </label>

          <label class="checkbox-label">
            <input type="checkbox" id="symbols" checked />
            <span>Special Characters</span>
          </label>
        </fieldset>

        <button id="generateBtn" type="submit" class="btn-primary">Generate</button>
      </form>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
